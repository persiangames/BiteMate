services:
  postgres:
    image: postgres:16-alpine
    container_name: bitemate-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bitemate}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bitemate_secret}
      POSTGRES_DB: ${POSTGRES_DB:-bitemate}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bitemate} -d ${POSTGRES_DB:-bitemate}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bitemate-network

  redis:
    image: redis:7-alpine
    container_name: bitemate-redis
    restart: unless-stopped
    command: redis-server --appendonly yes ${REDIS_PASSWORD:+--requirepass ${REDIS_PASSWORD}}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bitemate-network

  mongo:
    image: mongo:7
    container_name: bitemate-mongo
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bitemate-network

  api:
    build:
      context: ../..
      dockerfile: infra/docker/api/Dockerfile
    container_name: bitemate-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mongo:
        condition: service_healthy
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      API_PREFIX: api
      DATABASE_URL: postgresql://${POSTGRES_USER:-bitemate}:${POSTGRES_PASSWORD:-bitemate_secret}@postgres:5432/${POSTGRES_DB:-bitemate}?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MONGODB_URI: mongodb://mongo:27017/bitemate
      TRUST_PROXY: "true"
    expose:
      - "3000"
    volumes:
      - api_uploads:/app/apps/api/uploads
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"require('http').get('http://127.0.0.1:3000/api/health', (response) => process.exit(response.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\"",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - bitemate-network

  web:
    build:
      context: ../..
      dockerfile: infra/docker/web/Dockerfile
      args:
        VITE_API_BASE_URL: /api
        VITE_SOCKET_URL: ${VITE_SOCKET_URL:-}
    container_name: bitemate-web
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - bitemate-network

  gateway:
    build:
      context: ../..
      dockerfile: infra/docker/gateway/Dockerfile
    container_name: bitemate-gateway
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_started
    ports:
      - "${GATEWAY_PORT:-8080}:80"
    networks:
      - bitemate-network

volumes:
  postgres_data:
  redis_data:
  mongo_data:
  api_uploads:

networks:
  bitemate-network:
    driver: bridge
