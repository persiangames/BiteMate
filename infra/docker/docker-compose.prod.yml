# Production overrides — use with:
# docker compose -f infra/docker/docker-compose.yml -f infra/docker/docker-compose.prod.yml up -d

services:
  postgres:
    ports: []

  redis:
    ports: []

  mongo:
    ports: []

  api:
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 512M

  web:
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  gateway:
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
