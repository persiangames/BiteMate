name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bitemate
          POSTGRES_PASSWORD: test_secret
          POSTGRES_DB: bitemate_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bitemate -d bitemate_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
      mongo:
        image: mongo:7
        ports:
          - 27017:27017

    env:
      DATABASE_URL: postgresql://bitemate:test_secret@localhost:5432/bitemate_test?schema=public
      MONGODB_URI: mongodb://localhost:27017/bitemate_test
      REDIS_HOST: localhost
      JWT_SECRET: ci-test-jwt-secret-minimum-length
      WALLET_ENCRYPTION_KEY: ci-test-wallet-encryption-key-32chars!!

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: npm run shared:build

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Run migrations
        run: npm run db:migrate:deploy

      - name: Lint API
        run: npm run api:lint

      - name: Test API
        run: npm run api:test

      - name: Build API
        run: npm run api:build

      - name: Build Web
        run: npm run web:build

      - name: Build Admin
        run: npm run admin:build

  docker:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        run: docker build -f infra/docker/api/Dockerfile -t bitemate-api:ci .

      - name: Build Web image
        run: docker build -f infra/docker/web/Dockerfile -t bitemate-web:ci .

      - name: Build Gateway image
        run: docker build -f infra/docker/gateway/Dockerfile -t bitemate-gateway:ci .
